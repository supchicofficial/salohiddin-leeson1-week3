{% extends 'sport/base.html' %}

{% block title %}Вход - Sport{% endblock %}

{% block content %}
<section class="auth-card">
    <h1>Вход</h1>
    {% if form.errors %}
        <div class="error">Неверное имя пользователя или пароль.</div>
    {% endif %}
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
        <button class="button" type="submit">Войти</button>
    </form>
    <p>Нет аккаунта? <a href="{% url 'register' %}">Зарегистрироваться</a></p>
</section>
{% endblock %}
